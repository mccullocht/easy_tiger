[package]
name = "easy_tiger"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["et", "vectors", "wt_mdb", "wt_sys"]

[workspace.dependencies]
ahash = "0.8.12"
approx = "0.5.1"
bindgen = "0.72.1"
bitpacking = { version = "0.9.3", default-features = false, features = [
    "bitpacker4x",
] }
bytemuck = "1.24.0"
clap = { version = "4.6.7", features = ["derive"] }
cmake = "0.1.58"
criterion = "0.8.2"
crossbeam-skiplist = "0.1.3"
crossbeam-utils = "0.8.23"
half = { version = "2.7.1", features = ["bytemuck"] }
histogram = "1.5.0"
indicatif = "0.18.6"
leb128 = "0.2.7"
memmap2 = { version = "0.9.12", features = ["stable_deref_trait"] }
min-max-heap = "1.3.0"
pollster = "1.0.1"
rand = "0.10.2"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.1"
rayon = "1.12.0"
rustix = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.15"
stable_deref_trait = "1.2.1"
tdigests = "1.0.1"
tempfile = "3.27.0"
thread_local = "1.1.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "30.0.2"

[dependencies]
ahash = { workspace = true }
bitpacking = { workspace = true }
bytemuck = { workspace = true }
crossbeam-skiplist = { workspace = true }
half = { workspace = true }
leb128 = { workspace = true }
memmap2 = { workspace = true }
min-max-heap = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
stable_deref_trait = { workspace = true }
thread_local = { workspace = true }
tracing = { workspace = true }
vectors = { path = "./vectors" }
wt_mdb = { path = "./wt_mdb" }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
rand_xoshiro = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "token"
harness = false

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

[profile.bench]
debug = true
